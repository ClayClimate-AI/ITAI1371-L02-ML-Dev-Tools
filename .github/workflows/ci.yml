name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phase-0-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify environment
        run: python scripts/verify_setup.py
      - name: Run tests
        run: pytest tests/ -v
